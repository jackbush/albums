name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Resized images are expensive to regenerate; keep them between runs. The path is
      # `cacheDir` from astro.config.mjs — it must sit outside node_modules, which `npm ci`
      # deletes.
      #
      # The key covers the photos *and* the code that decides which variants exist: the
      # width ladders, formats and quality settings under src/, the image service in
      # astro.config.mjs, and sharp's pinned version. On an exact key hit actions/cache
      # skips the upload, so anything generated during that run is thrown away and
      # regenerated on every run after it — a width ladder edit with no photo change
      # would never be cached at all. restore-keys still seeds the new cache from the
      # previous run, so only the variants that actually changed are processed.
      - uses: actions/cache@v4
        with:
          path: .astro-cache
          key: astro-assets-${{ hashFiles('src/**', 'astro.config.mjs', 'integrations/**', 'package-lock.json') }}
          restore-keys: astro-assets-

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
